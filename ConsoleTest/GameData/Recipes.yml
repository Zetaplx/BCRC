# Wood Recipes
- id: recipe_plank_t1
  name: Rough Plank
  components:
  - recipe:
      inputs:
      - item-id: item_stripped_wood_t1
      static-outputs:
      - item-id: item_plank_t1
  - power-craft:
      tool-type: Saw
      power: 100
  - skill-requirement:
      skill-type: Carpentry
      min-level: 1
  - tool-requirement:
      tool-type: Saw
      min-tier: 0
  - station-requirement:
      station-type: CarpentryStation
      min-tier: 1

- id: recipe_stripped_wood_t1
  name: Rough Stripped Wood
  components:
  - recipe:
      inputs:
      - item-id: item_log_t1
        quantity: 3
      static-outputs:
      - item-id: item_stripped_wood_t1

- id: recipe_log_t1
  name: Rough Wood Log Output
  components:
  - recipe:
      inputs:
      - item-id: cargo_wood_trunk_t1
      bucket-outputs:
      - weight: 94
        static-outputs:
        - item-id: item_log_t1
          quantity: 6
      - weight: 6
        static-outputs:
          - item-id: item_log_t1
            quantity: 6
          - item-id: item_resin_t1

- id: recipe_bark_t1
  name: Rough Tree Bark Output
  components:
  - recipe:
      inputs:
      - item-id: cargo_wood_trunk_t1
      bucket-outputs:
      - weight: 94
        static-outputs:
        - item-id: item_bark_t1
          quantity: 4
      - weight: 6
        static-outputs:
        - item-id: item_bark_t1
          quantity: 4
        - item-id: item_resin_t1

